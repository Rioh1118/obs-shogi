name: Release

# 手順・タグの制約・空打ち・壊れたリリースの直し方は docs/RELEASE.md
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-release 識別子は 65535 以下の10進数だけ（MSI の制約）。
      # このパターンはそれより広く、外れたタグは Windows だけ落ちる。TODO(#285)
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # 排他するのはリリース1本＝タグ。`github.ref` にすると push と dispatch が別グループになる。
  # 下の `RELEASE_TAG` と同じ式なのは、ここでは `env` コンテキストが解決されないため
  # （寄せると空になり、全リリースが1つのグループに直列化される）。
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # 1. Create the GitHub Release (published immediately so "latest" URL works)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      # 4本の build が組む commit。ここで1度だけ解決して配る
      sha: ${{ steps.create.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or fetch release
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag      = process.env.RELEASE_TAG;
            const isPrerel = tag.includes('-') ||
                             '${{ github.event.inputs.prerelease }}' === 'true';
            const { owner, repo } = context.repo;

            // タグが指す commit。無ければ null。annotated tag は object が tag なのでもう一段引く。
            // **404 をここで閉じる**。下の try へ混ぜると、タグが無いことが
            // 「リリースが無い」と読み替えられて createRelease に落ち、422 で死ぬ。
            async function shaOfTag(tag) {
              try {
                const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                if (ref.data.object.type !== 'tag') return ref.data.object.sha;
                const t = await github.rest.git.getTag({ owner, repo, tag_sha: ref.data.object.sha });
                return t.data.object.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
                return null;
              }
            }

            // **タグの有無とリリースの有無は別。** createRelease はリリースを作るだけで、
            // タグが既にあれば触らない。リリースだけ消して撃ち直す経路があるので、
            // 「リリースが無い ⇒ タグも無い」と読むと dispatch した ref の先端を配ってしまう。
            const tagSha = await shaOfTag(tag);

            // Reuse if already exists (idempotent re-run)
            let releaseId = null;
            try {
              const r = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseId = String(r.data.id);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (releaseId === null) {
              // **target_commitish が効くのはタグをこれから作るときだけ**で、既にあれば無視される。
              // 省くと、新しいタグが撃った ref ではなく既定ブランチの上に作られる。
              const r = await github.rest.repos.createRelease({
                owner, repo,
                tag_name:         tag,
                target_commitish: context.sha,
                name:             `ObsShogi ${tag}`,
                body:             `## What's new\n\n*See the assets below to download and install.*`,
                draft:            false,   // must be false for latest/download/ URL to resolve
                prerelease:       isPrerel,
              });
              releaseId = String(r.data.id);
            }

            core.setOutput('release_id', releaseId);
            // タグが無かったなら、いま createRelease が context.sha の上に作った
            const sha = tagSha ?? context.sha;
            // 空を配らない。`actions/checkout` は空の `ref` を未指定と同じに扱い、
            // **黙って `github.ref` へ戻る**。ここで止めないと気づけない
            if (!sha) throw new Error(`cannot resolve a commit for ${tag}`);
            core.setOutput('sha', sha);

  # 2. Build, sign and upload bundles for every target platform
  build:
    name: Build · ${{ matrix.name }}
    needs: create-release
    strategy:
      # 1つの OS が落ちても残りは上げる。**資産の欠けたリリースが公開されたまま残る**
      # （直し方は docs/RELEASE.md）。
      fail-fast: false
      matrix:
        # ターゲットを決めるのは `rust_target` だけ。空は「ホストのまま組む」で、
        # `rustup target add` のステップも tauri への `--target` も出なくなる。
        include:
          # ── macOS ──────────────────────────────────────────────────────────
          - name: macOS-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin

          - name: macOS-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin

          # ── Windows ────────────────────────────────────────────────────────
          - name: Windows-x64
            runner: windows-latest
            rust_target: ""

          # ── Linux ──────────────────────────────────────────────────────────
          - name: Linux-x64
            runner: ubuntu-22.04
            rust_target: ""

    runs-on: ${{ matrix.runner }}

    steps:
      # **SHA で受け取る。** タグ名を渡すと `actions/checkout` は fetch した時点のタグを引く
      # （commit を固定するのは `ref` 未指定か 40桁 hex のときだけ）ので、
      # 走っている最中にタグを付け替えると leg ごとに別の木になる。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      # ── System dependencies ───────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Toolchains ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # 実際に使われるツールチェーンは rust-toolchain.toml が決める。
      # この action の targets: は stable に対して効いてしまい、固定版には付かないので使わない。
      - uses: dtolnay/rust-toolchain@stable

      # ガードが無いと、空の行が引数の無い `rustup target add` に展開されて exit 1 する。
      - name: Add build target (rust-toolchain.toml のツールチェーンに対して)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.name }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Derive version from tag (strip leading "v")
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV

      - name: Stamp version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          jq --arg v "$RELEASE_VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json
          python3 -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          p.write_text(re.sub(r'^version = \"[^\"]+\"', 'version = \"$RELEASE_VERSION\"', p.read_text(), count=1, flags=re.M))
          "

      - name: Build, sign & upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (stored in repo Secrets)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          args: ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) }}

          # 下2つの名前は tauri-action v1 のもの。**綴りを間違えても止まらない。**
          # 知らない入力は `Unexpected input(s)` の warning になるだけで、
          # ジョブは緑のまま資産名が CLI の既定へ落ちる。

          # 既定が true なので値としては再掲。消してよい入力に見せない
          uploadUpdaterJson: true

          # `[arch]` を固定の綴りに書き換えると、tauri-action が資産と署名を
          # 突き合わせられず latest.json から落ちる（綴りの一覧は docs/RELEASE.md）
          releaseAssetNamePattern: "ObsShogi-v[version]-[platform]-[arch][setup][ext]"
