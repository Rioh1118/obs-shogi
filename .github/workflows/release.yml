name: Release

# Triggered by version tags (v1.2.3) or manual dispatch
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-release: v1.0.0-1。`-` の後ろは数字だけにする。
      # Windows は msi も作る（`tauri.conf.json` の `bundle.targets: "all"`）が、
      # MSI の ProductVersion は数値しか持てないので `-beta.1` のような綴りは
      # bundler が bail し、**Windows の資産だけ欠けたリリースが公開される**（#256 と同じ形）
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # 1. Create the GitHub Release (published immediately so "latest" URL works)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or fetch release
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag      = process.env.RELEASE_TAG;
            const isPrerel = tag.includes('-') ||
                             '${{ github.event.inputs.prerelease }}' === 'true';
            const { owner, repo } = context.repo;

            // Reuse if already exists (idempotent re-run)
            try {
              const r = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setOutput('release_id', String(r.data.id));
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // タグがまだ無ければ createRelease が作る。target_commitish を省くと
            // 既定のデフォルトブランチの上に作られるので、workflow_dispatch を
            // ブランチから撃ったとき、タグは main を指すのに build の checkout は
            // github.ref を取り、**タグが指す木と配布物の中身が一致しない**。
            const r = await github.rest.repos.createRelease({
              owner, repo,
              tag_name:         tag,
              target_commitish: context.sha,
              name:             `ObsShogi ${tag}`,
              body:             `## What's new\n\n*See the assets below to download and install.*`,
              draft:            false,   // must be false for latest/download/ URL to resolve
              prerelease:       isPrerel,
            });
            core.setOutput('release_id', String(r.data.id));

  # 2. Build, sign and upload bundles for every target platform
  build:
    name: Build · ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # `rust_target` は rustup と tauri の両方が読む。空なら「ホストのまま組む」で、
        # `rustup target add` も `--target` も出さない。同じ文字列を2欄に置くと、
        # 片方だけ変えたときに std の無いターゲットへ組む形が黙って通る
        include:
          # ── macOS ──────────────────────────────────────────────────────────
          - name: macOS-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin

          - name: macOS-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin

          # ── Windows ────────────────────────────────────────────────────────
          - name: Windows-x64
            runner: windows-latest
            rust_target: ""

          # ── Linux ──────────────────────────────────────────────────────────
          - name: Linux-x64
            runner: ubuntu-22.04
            rust_target: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ───────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Toolchains ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # 実際に使われるツールチェーンは rust-toolchain.toml が決める。
      # この action の targets: は stable に対して効いてしまい、固定版には付かないので使わない。
      - uses: dtolnay/rust-toolchain@stable

      # `rust_target` が入っている行は tauri へ `--target` を渡すので、その std を
      # 先に入れておく（ホストと同じ側は no-op）。Windows と Linux はホストのまま
      # 組むので空で、ガードが無いと引数の無い `rustup target add` になって exit 1 する。
      - name: Add build target (rust-toolchain.toml のツールチェーンに対して)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.name }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Derive version from tag (strip leading "v")
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV

      - name: Stamp version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          jq --arg v "$RELEASE_VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json
          python3 -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          p.write_text(re.sub(r'^version = \"[^\"]+\"', 'version = \"$RELEASE_VERSION\"', p.read_text(), count=1, flags=re.M))
          "

      - name: Build, sign & upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (stored in repo Secrets)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          args: ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) }}

          # 名前は tauri-action v1 のもの。v0 の `includeUpdaterJson` /
          # `assetNamePattern` は存在しない入力になっていて、渡しても
          # `Unexpected input(s)` の warning が出るだけでジョブは緑のまま通る。
          # 届かないと updater の json が出ず、資産名も CLI の既定へ落ちる

          # updater の endpoint が解決できるように latest.json を出す
          uploadUpdaterJson: true

          # 人が読める資産名にする。
          #
          # **`[arch]` は bundle ごとに綴りが違う。** AppImage と deb は `amd64`、
          # rpm は `x86_64`、Windows と macOS は `x64` / `aarch64`。
          # 同じ x86-64 でも3通りの名前が出るので、ダウンロードの URL を
          # 手で組む文書はここを見て書くこと（v0.2.1 の資産が現物）。
          releaseAssetNamePattern: "ObsShogi-v[version]-[platform]-[arch][setup][ext]"
