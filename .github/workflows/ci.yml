name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck/lint/test/fmt/clippy)
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # 型エラーをフルビルド(Windows/macOS)まで遅らせないための最速ゲート
      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint (if present)
        run: npm run lint --if-present

      - name: Frontend test (if present)
        run: npm test --if-present

      - name: Install Linux deps (GTK/Webkit for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe

          sudo apt-get install -y \
            pkg-config \
            build-essential \
            curl wget file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev\
            libayatana-appindicator3-dev \
            librsvg2-dev\
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable (fmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build-desktop:
    name: Build (Windows/macOS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--no-bundle --verbose"
          # macOS: Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --no-bundle --verbose"
          # macOS: Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --no-bundle --verbose"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # 実際に使われるツールチェーンは rust-toolchain.toml が決める。
      # この action の targets: は stable に対して効いてしまい、固定版には付かないので使わない。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add build targets (rust-toolchain.toml のツールチェーンに対して)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build (tauri-action, no bundle)
        uses: tauri-apps/tauri-action@v0
        env:
          CI: "true"
        with:
          args: ${{ matrix.args }}
