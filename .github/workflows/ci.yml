name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck/lint/test/fmt/clippy)
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # 型エラーをフルビルド(Windows/macOS)まで遅らせないための最速ゲート
      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint (if present)
        run: npm run lint --if-present

      - name: Frontend test (if present)
        run: npm test --if-present

      # `verify` に入っている。ローカルでは commit ゲートが走らせるが、
      # ゲートを迂回して push された分をここで拾う。
      - name: Dead export ratchet
        run: npm run ratchet:knip

      # **`verify` には入っていない。** 判定を1件ずつ当てるので数分掛かり、
      # ローカルでは `.claude/hooks/*.sh` を触ったコミットでだけ門番自身が走らせる。
      # ここは、その分類ごと壊された場合の控え。
      - name: Commit gate self-test
        run: npm run test:hooks

      - name: Install Linux deps (GTK/Webkit for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe

          sudo apt-get install -y \
            pkg-config \
            build-essential \
            curl wget file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev\
            libayatana-appindicator3-dev \
            librsvg2-dev\
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable (fmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # `verify` と `verify:rust` の両方に入っている。npm 側の依存が増える変更は ts、
      # crate が増える変更は rust としか判定されないので、片方にしか置かないと
      # **増えたのに通知が増えていない**回を素通しする。
      # cargo が要るので、ツールチェーンを入れた後に置く。
      - name: Third-party notices ratchet
        run: npm run ratchet:notices

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # **`quality` の `cargo test` は Ubuntu でしか走らない。** `\\?\` の綴りのように
  # Windows でしか起きない振る舞いは、ビルドが通っても見えない。
  # 全件ではなく、Windows の綴りを固定するテストだけを名指しする。
  windows-tests:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 実際に使われるツールチェーンは rust-toolchain.toml が決める。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri は comctl32 v6 の関数を読み込むが、アプリのマニフェストは `tauri-build` が
      # bin にしか付けないので、テストの exe は起動時に STATUS_ENTRYPOINT_NOT_FOUND で落ちる。
      # 製品のビルドを変えないよう、マニフェストはこのステップの環境変数でだけ足す。
      # 値に空白があるので `RUSTFLAGS` では渡せない（`\x1f` 区切りの ENCODED を使う）。
      - name: Rust tests (Windows path spelling)
        shell: bash
        run: |
          CC6="type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'"
          export CARGO_ENCODED_RUSTFLAGS="$(printf '%s\x1f%s' '-Clink-arg=/MANIFEST:EMBED' "-Clink-arg=/MANIFESTDEPENDENCY:$CC6")"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib plain_spelling

  build-desktop:
    name: Build (Windows/macOS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--no-bundle --verbose"
          # macOS: Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --no-bundle --verbose"
          # macOS: Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --no-bundle --verbose"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # 実際に使われるツールチェーンは rust-toolchain.toml が決める。
      # この action の targets: は stable に対して効いてしまい、固定版には付かないので使わない。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add build targets (rust-toolchain.toml のツールチェーンに対して)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build (tauri-action, no bundle)
        uses: tauri-apps/tauri-action@v1
        env:
          CI: "true"
        with:
          args: ${{ matrix.args }}
