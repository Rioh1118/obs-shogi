version: 2
updates:
  # 更新 PR が多すぎるとレビューが追いつかず、結果として誰も見なくなる。
  # 月1回・同時 5 本までに絞り、セキュリティ更新だけは Dependabot が別枠で即時に出す。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # postcss と postcss-scss は peer で結ばれている（postcss-scss@4 は postcss ^8.4.29）。
      # postcss だけが major で先に上がると peer を割り、入れ子か解決失敗になる。
      # major も含めて1本にまとめる。
      postcss-toolchain:
        patterns:
          - postcss
          - postcss-scss
        update-types:
          - minor
          - patch
          - major
      # vitest と @vitejs/plugin-react は vite を peer に取る。vite だけが major で
      # 先に上がると peer を割るので、同じ理由で1本にまとめる。
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch
          - major
      # @eslint/js は eslint の同じ major を peer に取る。同じ理由で1本にまとめる。
      eslint-toolchain:
        patterns:
          - eslint
          - "@eslint/js"
        update-types:
          - minor
          - patch
          - major
      # パッチとマイナーは1本にまとめる。個別に見る価値が無いため。
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
