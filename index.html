<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      **外部オリジンをここに書かない。** 配布物の CSP（`src-tauri/tauri.conf.json` の
      `app.security.csp`）は `style-src 'self' 'unsafe-inline'` / `font-src 'self' data:` で、
      外部のスタイルシートも書体も落とす。dev サーバには CSP が乗らないので、
      書けば**開発中だけ効いて配布物では効かない**という差ができる（→ #503）。
      同梱している書体の読み込みは `src/main.tsx`。
    -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS-SHOGI</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <!--
      落ちた範囲を伝える箱のうち、浮かせて出すものを積む器
      （`src/shared/ui/error-fallback/FloatingErrorFallback.tsx`）。
      **落ちた後に作りに行かなくて済むよう、ここで用意しておく。**
      積み方は `FloatingErrorFallback.scss` の `.error-overlay`
    -->
    <div id="error-overlay-root" class="error-overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
