[workspace]
members = ["crates/*"]

# **版はここでだけ決める。** crate ごとに書くと、1つ上げ忘れた crate が
# 別の版を引き、同じ型が2つある状態になる（`serde` の `Serialize` が
# 別物になると、境界に出す型が繋がらない）。
[workspace.dependencies]
shogi_kifu_converter_obsshogi = { git = "https://github.com/Rioh1118/shogi-kifu-converter-obsshogi.git", tag = "v0.5.0", package = "shogi-kifu-converter" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
encoding_rs = "0.8"
uuid = { version = "1.17.0", features = ["v4"] }
tauri = { version = "2.5.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.0"
usi = "0.6.2"
shogi_core = "0.1.5"
tokio = { version = "1.45.1", features = ["full"] }
dashmap = "6.1.0"
parking_lot = "0.12"
arc-swap = "1.8.1"
walkdir = "2.5.0"
notify = "8.2.0"
rayon = "1.11.0"
tokio-util = { version = "0.7.18", default-features = false }

thiserror = "2.0.12"
sysinfo = "=0.38.3"
tauri-plugin-fs = "2"
zstd = "0.13"
blake3 = "1.8"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
autobenches = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
fs = { path = "crates/fs" }
kifu-text = { path = "crates/kifu-text" }

shogi_kifu_converter_obsshogi = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
encoding_rs = { workspace = true }
uuid = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-dialog = { workspace = true }
usi = { workspace = true }
shogi_core = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
rayon = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
tauri-plugin-fs = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }

[dev-dependencies]
test-support = { path = "crates/test-support" }
# `tidy_csa` の整形が tsshogi の受ける範囲を出ていないかを、
# tsshogi 自身の正規表現を読んで確かめるために使う（`kifu_reader.rs` のテスト）
regex = "1.11"

[[test]]
name = "search_bench"
path = "benches/search_bench.rs"
