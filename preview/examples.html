<style>
body { margin: 0; font-family: var(--lm-font-family-sans); font-size: var(--lm-font-size-body); line-height: var(--lm-font-line-height-body); background: var(--lm-color-background-default); color: var(--lm-color-text-default); }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: var(--lm-font-size-xl); line-height: var(--lm-font-line-height-heading); }
h2 { font-size: var(--lm-font-size-lg); line-height: var(--lm-font-line-height-heading); margin-top: 32px; }
a { color: inherit; }
.pv-note { color: var(--lm-color-text-subtle); }
.pv-themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.pv-theme { padding: 16px; border: 1px solid var(--lm-color-border-default); background: var(--lm-color-background-default); color: var(--lm-color-text-default); }
.pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
table { border-collapse: collapse; width: 100%; font-size: var(--lm-font-size-caption); }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--lm-color-border-default); vertical-align: middle; }
.pv-swatch { display: inline-block; width: 32px; height: 20px; border: 1px solid var(--lm-color-border-default); vertical-align: middle; }
.pv-bar { display: inline-block; height: 12px; background: var(--lm-color-text-subtle); vertical-align: middle; }
code { font-size: var(--lm-font-size-caption); }
</style>
</head>

<p class="pv-note">生成物（npm run ds:build）。値はすべて仮。 <a href="index.html">トークン</a> · <a href="button.html">Button</a> · <a href="examples.html">良い例</a></p>
<h1>良い例（examples/good）</h1><div class="pv-themes">
<section class="pv-theme" data-theme="light" aria-label="light テーマ"><h2>light</h2><form class="lm-example-actions" aria-label="変更の保存"><button type="button" class="lm-button lm-button--secondary">キャンセル</button><button type="submit" class="lm-button lm-button--primary">変更を保存する</button></form></section>
<section class="pv-theme" data-theme="dark" aria-label="dark テーマ"><h2>dark</h2><form class="lm-example-actions" aria-label="変更の保存"><button type="button" class="lm-button lm-button--secondary">キャンセル</button><button type="submit" class="lm-button lm-button--primary">変更を保存する</button></form></section>
</div>
</main>
